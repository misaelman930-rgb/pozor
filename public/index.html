<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Позор Squad</title>
<style>
:root{
  --bg-0:#1b1c21; --bg-1:#23252c; --bg-2:#2b2e37; --bg-3:#353945;
  --line:#3a3e4a; --fg:#eef0f5; --fg-2:#a5aab8; --fg-3:#6f7585;
  --accent:#ff5a4e; --accent-ink:#1d0c0a; --ok:#5fd38d; --warn:#f0b64a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg-0);color:var(--fg);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
input,select{background:var(--bg-0);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:72px 240px minmax(0,1fr) 230px;height:100%}
.servers{background:var(--bg-0);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:10px}
.srv{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:18px}

.side{background:var(--bg-1);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.side-h{padding:14px 16px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:14px 16px 6px;font-weight:700}
#channels{flex:1;min-height:0;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px}
.ch{display:flex;align-items:center;gap:6px;border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;width:100%}
.ch:hover{background:var(--bg-2);color:var(--fg)}
.ch.on{background:var(--bg-3);color:var(--fg)}
.ch .label{overflow:hidden;text-overflow:ellipsis;flex:1}
.hash{color:var(--fg-3);font-weight:700}
.cnt{font-size:11px;color:var(--fg-3)}
.ch-mem{padding:0 8px 4px 28px;font-size:12px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add{margin:6px 8px;border:1px dashed var(--line);background:none;color:var(--fg-2);padding:7px;border-radius:6px;flex:none}
.add:hover{color:var(--fg);border-color:var(--fg-3)}
.addform{margin:0 8px 8px;display:flex;flex-direction:column;gap:6px;flex:none}
.addform select,.addform input{width:100%}
.row{display:flex;gap:6px}
.row input{flex:1}

.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:7px 10px;font-weight:700}
.ghost{background:var(--bg-3);color:var(--fg);border:0;border-radius:6px;padding:7px 10px;font-weight:600}

.voicebar{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px;flex:none}
#vbInfo:empty{display:none}
.vb-top{display:flex;align-items:center;gap:8px;min-width:0}
.vb-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ok)}
.vb-btns{display:flex;gap:6px}
.vb-btns button{flex:1}
.mic-lbl{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.04em}
#micSel{width:100%;text-transform:none;letter-spacing:0;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}

.me{border-top:1px solid var(--line);padding:8px;background:var(--bg-0);flex:none}
.me-btn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px;border-radius:6px;text-align:left;min-width:0}
.me-btn:hover{background:var(--bg-2)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#14151a;flex:none;background:hsl(var(--h) 70% 62%)}
.me-text{min-width:0;display:flex;flex-direction:column}
.me-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-sub{font-size:11px;color:var(--fg-3)}
.me-sub.ok{color:var(--ok)}
.me-sub.bad{color:var(--warn)}

.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;background:var(--bg-2)}
.chat-h{display:flex;align-items:center;gap:8px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);min-width:0}
.chat-h .hash{font-size:20px}
#chTitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--fg-3);font-size:12px;margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.msgs{overflow-y:auto;overflow-x:hidden;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;min-height:0}
.msg{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:2px 8px;border-radius:6px;position:relative}
.msg:hover{background:rgba(255,255,255,.025)}
.msg.first{margin-top:14px}
.msg.sys{grid-template-columns:minmax(0,1fr);color:var(--fg-3);font-style:italic;padding:6px 8px;margin-top:10px}
.msg .meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.msg .who{font-weight:700}
.msg .time{font-size:11px;color:var(--fg-3)}
.msg .txt{overflow-wrap:anywhere}
.react{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--bg-1);border-radius:999px;padding:1px 8px;font-size:13px;color:var(--fg-2)}
.chip.mine{border-color:var(--accent);color:var(--fg)}
.tools{position:absolute;right:8px;top:-14px;display:none;gap:2px;background:var(--bg-1);border:1px solid var(--line);border-radius:8px;padding:2px;flex-wrap:wrap;max-width:calc(100% - 16px)}
.msg:hover .tools,.msg:focus-within .tools{display:flex}
.tools button{border:0;background:none;padding:4px 6px;border-radius:5px;font-size:14px;color:var(--fg)}
.tools button:hover{background:var(--bg-3)}
.empty{margin:auto;text-align:center;color:var(--fg-3);padding:24px}

.voice-view{margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;text-align:center;color:var(--fg-2);max-width:360px;width:100%}
.voice-view .big{font-size:40px}
.voice-view h3{margin:0;color:var(--fg);font-size:18px}
.vlist{display:flex;flex-direction:column;gap:6px;width:100%}
.vmem{display:flex;align-items:center;gap:8px;justify-content:center;min-width:0}
.vempty{color:var(--fg-3)}
.voice-view .primary,.voice-view .ghost{padding:10px 18px;font-size:15px}

.composer{display:flex;gap:10px;align-items:flex-end;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.composer textarea{flex:1;resize:none;max-height:160px;background:var(--bg-3);border:0;border-radius:8px;padding:10px 12px;outline:none;min-width:0}
.composer textarea::placeholder{color:var(--fg-3)}
#send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 14px;font-weight:700;flex:none}

.members{background:var(--bg-1);border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding-bottom:12px}
.members .section-label{padding-top:14px}
.roles{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px}
.role-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg-0);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--fg-2);max-width:100%}
.role-chip.on{border-color:currentColor;color:var(--fg)}
.role-chip .x{border:0;background:none;color:var(--fg-3);padding:0 2px;font-size:14px;line-height:1}
.dot2{width:10px;height:10px;border-radius:50%;flex:none}
.hint{font-size:12px;color:var(--fg-3)}
.roleform{display:flex;flex-direction:column;gap:6px;padding:0 12px}
.roleform .row{align-items:center}
.roleform input[type=color]{width:44px;height:36px;padding:2px;flex:none}
.small{margin:0 12px;border:1px dashed var(--line);background:none;color:var(--fg-2);padding:6px;border-radius:6px;width:calc(100% - 24px);text-align:left}
.small:hover{color:var(--fg)}
.mem{display:flex;align-items:center;gap:8px;padding:5px 12px;color:var(--fg-2);min-width:0;width:100%;border:0;background:none;text-align:left;border-radius:6px}
.mem:hover{background:var(--bg-2)}
.mem .av{width:26px;height:26px;font-size:11px}
.mem .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.mem.me-row .name{font-weight:600}
.mem-roles{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 8px 46px}
.mem-roles .role-chip{background:none}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:5}
.card{position:relative;background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:18px}
.card p{margin:0;color:var(--fg-2)}
.card input{padding:10px}
.card button.primary{padding:10px}
.card .err{color:var(--warn);min-height:1em;font-size:13px}
.closex{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--fg-3);font-size:22px;padding:4px 8px;line-height:1}
.closex:hover{color:var(--fg)}

.card.wide{width:min(520px,100%);max-height:88vh;overflow-y:auto}
.codelist{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;align-items:center;gap:8px;background:var(--bg-0);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.crow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow code{font-family:ui-monospace,Consolas,monospace;color:var(--fg-2);font-size:13px}
.badge{font-size:11px;border-radius:999px;padding:1px 7px;border:1px solid var(--line);color:var(--fg-3);white-space:nowrap}
.badge.admin{color:var(--warn);border-color:var(--warn)}
.badge.mod{color:var(--ok);border-color:var(--ok)}
.small-btn{padding:5px 8px;font-size:12px;flex:none}
.newcode{background:var(--bg-0);border:1px dashed var(--ok);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.newcode code{font-size:18px;font-family:ui-monospace,Consolas,monospace;letter-spacing:.05em;overflow-wrap:anywhere}
#panelBtn{width:100%;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg-3);color:var(--fg);padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:6;max-width:calc(100% - 32px)}

#remotes{display:none}

@media (max-width:900px){
  .app{grid-template-columns:72px 200px minmax(0,1fr)}
  .members{display:none}
}
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .servers,.members{display:none}
  .side{max-height:46vh;overflow-y:auto}
  .me{padding:6px 8px}
  .me-sub{display:none}
  .sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="app">
  <aside class="servers" aria-label="Серверы">
    <div class="srv" title="Позор Squad">П</div>
  </aside>

  <aside class="side">
    <header class="side-h">Позор Squad</header>
    <nav id="channels" aria-label="Каналы"></nav>

    <button class="add" id="addBtn" type="button">+ Новый канал</button>
    <form class="addform" id="addForm" hidden>
      <select id="addType" aria-label="Тип канала">
        <option value="text">Текстовый канал</option>
        <option value="voice">Голосовой канал</option>
      </select>
      <div class="row">
        <input id="addIn" placeholder="название" maxlength="24" autocomplete="off" aria-label="Название канала">
        <button class="primary" type="submit">OK</button>
      </div>
    </form>

    <div class="voicebar" id="voiceBar">
      <div id="vbInfo"></div>
      <label class="mic-lbl">Микрофон
        <select id="micSel" aria-label="Выбор микрофона"></select>
      </label>
    </div>

    <div class="me">
      <button class="ghost" id="panelBtn" type="button" hidden>Панель</button>
      <button class="me-btn" id="meBtn" type="button" title="Сменить ник">
        <span class="av" id="meAv"></span>
        <span class="me-text">
          <span class="me-name" id="meName"></span>
          <span class="me-sub" id="connState">…</span>
        </span>
      </button>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-h">
      <span class="hash" id="chPrefix">#</span>
      <span id="chTitle"></span>
      <span class="sub" id="chSub"></span>
    </header>
    <div class="msgs" id="msgs" role="log" aria-live="polite"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Сначала войди" aria-label="Сообщение" disabled></textarea>
      <button id="send" type="submit" disabled>Отправить</button>
    </form>
  </main>

  <aside class="members" id="membersPanel">
    <div id="members"></div>
  </aside>
</div>

<div id="remotes"></div>

<div class="overlay" id="login" hidden>
  <form class="card" id="loginForm">
    <button class="closex" id="closeLogin" type="button" aria-label="Закрыть" hidden>×</button>
    <h2>Как тебя позорить?</h2>
    <p>Ник видят остальные участники.</p>
    <input id="nameIn" maxlength="20" placeholder="Твой ник" autocomplete="off" aria-label="Ник">
    <input id="codeIn" placeholder="Код доступа" autocomplete="off" aria-label="Код доступа" hidden>
    <div class="err" id="loginErr"></div>
    <button class="primary" type="submit" id="loginBtn">Войти</button>
  </form>
</div>

<div class="overlay" id="panel" hidden>
  <div class="card wide" role="dialog" aria-label="Панель">
    <button class="closex" id="closePanel" type="button" aria-label="Закрыть">×</button>
    <h2>Панель</h2>
    <p class="hint" id="panelHint"></p>
    <form id="codeForm" style="display:flex;flex-direction:column;gap:8px">
      <div class="row"><input id="cName" maxlength="20" placeholder="Ник" autocomplete="off" aria-label="Ник"><select id="cRole" aria-label="Роль"></select></div>
      <div class="row"><button class="primary" type="submit">Создать код</button></div>
    </form>
    <div id="newCode"></div>
    <div class="section-label" style="padding:4px 0 0">Коды</div>
    <div class="codelist" id="codeList"></div>
  </div>
</div>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var ICE = { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]};

  var S = {
    me: null, id: null, code: '', ready: false,
    reactions: ['🔥','😂','💀','🤡'],
    channels: [], roles: [], members: [], voice: {}, msgs: {},
    cur: null,            // текущий текстовый канал
    view: 'text',         // 'text' или 'voice' (просмотр голосового канала)
    viewVoice: null,      // голосовой канал, который открыт в просмотре
    myVoice: null,        // голосовой канал, в котором мы сейчас
    muted: false, localStream: null, micId: '', peers: {},
    es: null, expanded: null, roleFormOpen: false
  };
  try { S.micId = localStorage.getItem('squad-mic') || ''; } catch(_) {}

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function hue(name){ var h = 0; for (var i = 0; i < name.length; i++) h = (h*31 + name.charCodeAt(i)) % 360; return h; }
  function fmtTime(ts){ return new Date(ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); }
  function plural(n, f){ var a = n % 10, b = n % 100; if (a === 1 && b !== 11) return f[0]; if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return f[1]; return f[2]; }
  function avatar(name){ return '<span class="av" style="--h:' + hue(name) + '">' + esc(name.charAt(0).toUpperCase()) + '</span>'; }

  function toast(text){
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3500);
  }

  function api(path, body){
    var sep = path.indexOf('?') >= 0 ? '&' : '?';
    return fetch(path + sep + 'code=' + encodeURIComponent(S.code), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body || {})
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if (!r.ok) throw new Error(d.error || ('Ошибка ' + r.status));
        return d;
      });
    });
  }

  function setConn(text, cls){
    var el = $('#connState');
    el.textContent = text;
    el.className = 'me-sub' + (cls ? ' ' + cls : '');
  }

  // Цвет имени = цвет первой роли участника с цветом.
  function roleColor(name){
    var m = S.members.filter(function(x){ return x.name === name; })[0];
    if (!m) return '';
    var r = (m.roles || []).filter(function(x){ return x.color; })[0];
    return r ? r.color : '';
  }
  function nameHTML(name, extra){
    var c = roleColor(name);
    return '<span class="' + (extra || '') + '" style="' + (c ? 'color:' + esc(c) : '') + '">' + esc(name) + '</span>';
  }

  // ----- Вход -----

  function openLogin(err){
    $('#login').hidden = false;
    $('#closeLogin').hidden = !S.me;
    // Уже в чате: код не спрашиваем, меняем только ник.
    $('#codeIn').hidden = !(S.needsCode && !S.ready);
    $('#loginErr').textContent = err || '';
    if (!$('#nameIn').value) $('#nameIn').value = S.me || localStorage.getItem('squad-name') || '';
    $('#loginBtn').disabled = false;
    setTimeout(function(){ $('#nameIn').focus(); }, 0);
  }
  function closeLogin(){ $('#login').hidden = true; }

  function connect(name){
    S.me = name;
    localStorage.setItem('squad-name', name);
    if (S.code) localStorage.setItem('squad-code', S.code);
    var id = sessionStorage.getItem('squad-id');
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2));
      sessionStorage.setItem('squad-id', id);
    }
    S.id = id;
    if (S.es) S.es.close();

    var es = new EventSource('/events?id=' + encodeURIComponent(id) + '&name=' + encodeURIComponent(name) + '&code=' + encodeURIComponent(S.code));
    S.es = es;
    setConn('подключение…');

    function on(evt, fn){ es.addEventListener(evt, function(e){ fn(JSON.parse(e.data)); }); }

    on('hello', function(d){
      S.channels = d.channels;
      S.role = d.role || 'member';
      S.roles = d.roles;
      S.members = d.members;
      S.voice = d.voice;
      var texts = textChannels();
      if (!S.cur || !texts.some(function(c){ return c.id === S.cur; })) S.cur = texts[0] ? texts[0].id : null;

      // Если страница перезагрузилась, локального микрофона уже нет. Выходим на сервере.
      if (d.myVoice && !S.localStream) {
        api('/api/voice', { id: S.id, channel: d.myVoice, join: false }).catch(function(){});
        S.myVoice = null;
      } else {
        S.myVoice = d.myVoice || null;
      }

      S.ready = true;
      setConn('в сети', 'ok');
      closeLogin();
      if (S.cur && !S.msgs[S.cur]) loadChannel(S.cur);
      syncPeers();
      renderAll(true);
    });
    es.onerror = function(){ setConn('нет связи, переподключаюсь…', 'bad'); };
    on('presence', function(d){ S.members = d.members; renderMembers(); renderChannels(); });
    on('channels', function(d){ S.channels = d.channels; renderAll(false); });
    on('roles', function(d){ S.roles = d.roles; renderMembers(); });
    on('message', function(d){
      var list = S.msgs[d.channel];
      if (!list) return;
      if (list.some(function(m){ return m.id === d.msg.id; })) return;
      var near = isNearBottom();
      list.push(d.msg);
      if (S.view === 'text' && d.channel === S.cur) { renderMain(near || d.msg.author === S.me); renderHeader(); renderChannels(); }
    });
    on('message-update', function(d){
      var list = S.msgs[d.channel]; if (!list) return;
      for (var i = 0; i < list.length; i++) if (list[i].id === d.msg.id) list[i] = d.msg;
      if (S.view === 'text' && d.channel === S.cur) renderMain(false);
    });
    on('message-delete', function(d){
      if (!S.msgs[d.channel]) return;
      S.msgs[d.channel] = S.msgs[d.channel].filter(function(m){ return m.id !== d.messageId; });
      if (S.view === 'text' && d.channel === S.cur) { renderMain(false); renderHeader(); renderChannels(); }
    });
    on('voice', function(d){
      S.voice = d.voice;
      syncPeers();
      renderAll(false);
    });
    on('signal', function(d){ handleSignal(d.from, d.data).catch(function(){}); });
  }

  $('#loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var name = $('#nameIn').value.trim().slice(0, 20);
    if (!name) return openLogin('Введи ник');
    var code = $('#codeIn').hidden ? S.code : $('#codeIn').value.trim();

    fetch('/api/check?code=' + encodeURIComponent(code) + '&name=' + encodeURIComponent(name), {cache:'no-store'}).then(function(r){
      if (r.status === 403) { $('#loginBtn').disabled = false; return openLogin('Неверный код или ник'); }
      if (!r.ok) { $('#loginBtn').disabled = false; return openLogin('Не получилось войти'); }

      connect(name);
    }).catch(function(){ $('#loginBtn').disabled = false; openLogin('Нет связи с сервером'); });

  $('#closeLogin').addEventListener('click', closeLogin);

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      if (!$('#login').hidden && S.me) closeLogin();

      if (!$('#addForm').hidden) $('#addForm').hidden = true;
    }

  fetch('/api/config').then(function(r){ return r.json(); }).then(function(cfg){
    S.reactions = cfg.reactions || S.reactions;
    S.needsCode = !!cfg.needsCode;
    if (cfg.needsCode) {
      $('#codeIn').hidden = false;
      $('#codeIn').value = localStorage.getItem('squad-code') || '';
    }
    S.code = cfg.needsCode ? (localStorage.getItem('squad-code') || '') : '';
    var saved = localStorage.getItem('squad-name');
    if (saved && (!cfg.needsCode || S.code)) {
      fetch('/api/check?code=' + encodeURIComponent(S.code) + '&name=' + encodeURIComponent(saved), {cache:'no-store'}).then(function(r){
        if (r.status === 403) { openLogin('Неверный код или ник'); return; }
        connect(saved);
      }).catch(function(){ openLogin(); });

      openLogin();

  }).catch(function(){ setConn('сервер недоступен', 'bad'); openLogin('Сервер не отвечает, попробуй позже'); });

  // ----- Данные -----

  function textChannels(){ return S.channels.filter(function(c){ return c.type === 'text'; }); }
  function voiceChannels(){ return S.channels.filter(function(c){ return c.type === 'voice'; }); }
  function findCh(id){ return S.channels.filter(function(c){ return c.id === id; })[0] || null; }
  function curText(){ return findCh(S.cur) || {name: '…', id: null}; }
  function curList(){ return S.msgs[S.cur] || []; }
  function isNearBottom(){
    var box = $('#msgs');
    return box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  }

  function loadChannel(ch){
    if (!ch) return;
    fetch('/api/messages?channel=' + encodeURIComponent(ch) + '&code=' + encodeURIComponent(S.code))
      .then(function(r){ return r.json(); })
      .then(function(d){
        S.msgs[ch] = d.messages || [];
        if (S.view === 'text' && ch === S.cur) { renderMain(true); renderHeader(); }
      }).catch(function(){ toast('Не получилось загрузить канал'); });

  // ----- Отрисовка -----

  function renderAll(scroll){
    renderChannels();
    renderHeader();
    renderMain(scroll);
    renderMembers();
    renderVoiceBar();
    renderMe();
  }

  function renderChannels(){
    var voiceHTML = voiceChannels().map(function(c){
      var mem = S.voice[c.id] || [];
      var on = S.view === 'voice' && S.viewVoice === c.id;
      return '<button class="ch' + (on ? ' on' : '') + '" type="button" data-vch="' + c.id + '">' +
        '<span class="hash">🔊</span><span class="label">' + esc(c.name) + '</span>' +
        (mem.length ? '<span class="cnt">' + mem.length + '</span>' : '') + '</button>' +
        (mem.length ? '<div class="ch-mem">' + mem.map(function(m){ return esc(m.name); }).join(', ') + '</div>' : '');
    }).join('');

    $('#channels').innerHTML =
      '<div class="section-label">Текстовые каналы</div>' +
      textChannels().map(function(c){
        var on = S.view === 'text' && c.id === S.cur;
        return '<button class="ch' + (on ? ' on' : '') + '" type="button" data-ch="' + c.id + '"><span class="hash">#</span><span class="label">' + esc(c.name) + '</span></button>';

  function renderHeader(){
    if (S.view === 'voice') {
      var ch = findCh(S.viewVoice);
      $('#chPrefix').textContent = '🔊';
      $('#chTitle').textContent = ch ? ch.name : '';
      var n = ch ? (S.voice[ch.id] || []).length : 0;
      $('#chSub').textContent = n ? n + ' ' + plural(n, ['в голосе','в голосе','в голосе']) : 'Пусто';
    } else {
      var list = curList();
      $('#chPrefix').textContent = '#';
      $('#chTitle').textContent = curText().name;
      $('#chSub').textContent = list.length ? list.length + ' ' + plural(list.length, ['сообщение','сообщения','сообщений']) : '';
    }

  function msgHTML(m, prev){
    if (m.sys) return '<div class="msg sys"><div class="txt">' + esc(m.text) + '</div></div>';
    var grouped = prev && !prev.sys && prev.author === m.author && (m.ts - prev.ts) < 5*60*1000;
    var reactions = m.reactions || {};
    var chips = Object.keys(reactions).filter(function(e){ return reactions[e].length; }).map(function(e){
      var arr = reactions[e];
      return '<button class="chip' + (arr.indexOf(S.me) >= 0 ? ' mine' : '') + '" type="button" data-react="' + m.id + '" data-e="' + e + '">' + e + ' ' + arr.length + '</button>';
    }).join('');
    var tools = S.reactions.map(function(e){
      return '<button type="button" data-react="' + m.id + '" data-e="' + e + '" aria-label="Реакция ' + e + '">' + e + '</button>';
    }).join('');
    if (m.author === S.me) tools += '<button type="button" data-del="' + m.id + '" aria-label="Удалить сообщение">🗑</button>';

    return '<div class="msg ' + (grouped ? 'cont' : 'first') + '">' +
      (grouped ? '<span class="av" style="visibility:hidden" aria-hidden="true"></span>' : avatar(m.author)) +
      '<div>' +
        (grouped ? '' : '<div class="meta">' + nameHTML(m.author, 'who') + '<span class="time">' + fmtTime(m.ts) + '</span></div>') +
        '<div class="txt">' + esc(m.text).replace(/\n/g, '<br>') + '</div>' +
        (chips ? '<div class="react">' + chips + '</div>' : '') +
      '</div>' +
      '<div class="tools">' + tools + '</div>' +
    '</div>';
  }

    $('#input').disabled = !canWrite;
    $('#send').disabled = !canWrite;
    $('#input').placeholder = !S.ready ? 'Подключение…' : (S.view === 'text' ? 'Написать в #' + curText().name : 'Голосовой канал — писать нельзя');

    if (S.view === 'voice') {
      var ch = findCh(S.viewVoice);
      var mem = ch ? (S.voice[ch.id] || []) : [];
      var inThis = S.myVoice === S.viewVoice;
      box.innerHTML = '<div class="voice-view">' +
        '<div class="big">🔊</div>' +
        '<h3>' + esc(ch ? ch.name : 'Канал не найден') + '</h3>' +
        '<div class="vlist">' + (mem.length
          ? mem.map(function(m){ return '<div class="vmem"><span class="dot"></span>' + nameHTML(m.name) + (m.id === S.id ? ' <span class="cnt">(ты)</span>' : '') + '</div>'; }).join('')

        '</div>';

    var list = curList();
    box.innerHTML = list.length
      ? list.map(function(m, i){ return msgHTML(m, list[i-1]); }).join('')
      : '<div class="empty">Здесь пока тихо. Напиши первым, а то позорить будет нечего.</div>';

      if (S.expanded === m.name) {

            }).join('')
          : '<span class="hint">Сначала создай роль выше</span>') + '</div>';

    p.then(function(){ toast('Скопировано'); }).catch(function(){ toast('Не вышло скопировать, выдели код вручную'); });

  $('#codeForm').addEventListener('submit', function(e){

  // ----- Голос -----

  function getMic(deviceId){
    return navigator.mediaDevices.getUserMedia({
      audio: { deviceId: deviceId ? { exact: deviceId } : undefined, echoCancellation: true, noiseSuppression: true },
      video: false
    });
  }

  function stopStream(stream){
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
  }

  function refreshMics(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return Promise.resolve();
    return navigator.mediaDevices.enumerateDevices().then(function(list){
      var mics = list.filter(function(d){ return d.kind === 'audioinput'; });
      $('#micSel').innerHTML = mics.length
        ? mics.map(function(d, i){ return '<option value="' + esc(d.deviceId) + '">' + esc(d.label || ('Микрофон ' + (i + 1))) + '</option>'; }).join('')
        : '<option value="">Микрофон не найден</option>';
      if (!mics.some(function(d){ return d.deviceId === S.micId; }) && mics[0]) S.micId = mics[0].deviceId;
      if (S.micId) $('#micSel').value = S.micId;
    }).catch(function(){});
  }

  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener('devicechange', refreshMics);
  }

  $('#micSel').addEventListener('change', function(){
    S.micId = this.value;
    try { localStorage.setItem('squad-mic', S.micId); } catch(_) {}
    if (S.myVoice && S.localStream) switchMic();
  });

  function switchMic(){
    getMic(S.micId).then(function(stream){
      var track = stream.getAudioTracks()[0];
      track.enabled = !S.muted;
      Object.keys(S.peers).forEach(function(pid){
        var sender = S.peers[pid].pc.getSenders().filter(function(s){ return s.track && s.track.kind === 'audio'; })[0];
        if (sender) sender.replaceTrack(track).catch(function(){});
      });
      stopStream(S.localStream);
      S.localStream = stream;
      refreshMics();
    }).catch(function(){ toast('Не получилось переключить микрофон'); });
  }

  function signal(to, data){
    return api('/api/signal', { id: S.id, to: to, data: data }).catch(function(){});
  }

  function createPeer(pid, initiator){
    if (S.peers[pid]) return S.peers[pid];
    var pc = new RTCPeerConnection(ICE);
    var entry = { pc: pc, pending: [] };
    S.peers[pid] = entry;
    S.localStream.getTracks().forEach(function(t){ pc.addTrack(t, S.localStream); });

    pc.onicecandidate = function(e){
      if (e.candidate) signal(pid, { type: 'ice', candidate: e.candidate });
    };
    pc.ontrack = function(e){
      var a = document.getElementById('a-' + pid);
      if (!a) {
        a = document.createElement('audio');
        a.id = 'a-' + pid;
        a.autoplay = true;
        a.playsInline = true;
        $('#remotes').appendChild(a);
      }
      a.srcObject = e.streams[0];
    };
    pc.onconnectionstatechange = function(){
      if (pc.connectionState === 'failed' || pc.connectionState === 'closed') dropPeer(pid);
    };

    if (initiator) {
      pc.createOffer()
        .then(function(o){ return pc.setLocalDescription(o); })
        .then(function(){ signal(pid, { type: 'offer', sdp: pc.localDescription }); })
        .catch(function(){ dropPeer(pid); });
    }
    return entry;
  }

  function dropPeer(pid){
    var entry = S.peers[pid];
    if (entry) { try { entry.pc.close(); } catch(_){} }
    delete S.peers[pid];
    var a = document.getElementById('a-' + pid);
    if (a) a.remove();
  }

  function dropAllPeers(){
    Object.keys(S.peers).forEach(dropPeer);
  }

  // Оставляем соединения только с теми, кто сейчас в нашем голосовом канале.
  function syncPeers(){
    if (!S.myVoice) return dropAllPeers();
    var ids = {};
    (S.voice[S.myVoice] || []).forEach(function(m){ ids[m.id] = true; });
    Object.keys(S.peers).forEach(function(pid){ if (!ids[pid]) dropPeer(pid); });
  }

  function flushPending(entry){
    entry.pending.forEach(function(c){ entry.pc.addIceCandidate(c).catch(function(){}); });
    entry.pending = [];
  }

  function handleSignal(from, d){
    if (!S.myVoice || !S.localStream) return Promise.resolve();
    if (d.type === 'offer') {
      if (S.peers[from]) dropPeer(from);
      var entry = createPeer(from, false);
      return entry.pc.setRemoteDescription(d.sdp)
        .then(function(){ flushPending(entry); return entry.pc.createAnswer(); })
        .then(function(ans){ return entry.pc.setLocalDescription(ans); })
        .then(function(){ return signal(from, { type: 'answer', sdp: entry.pc.localDescription }); });
    }
    var e2 = S.peers[from];
    if (!e2) return Promise.resolve();
    if (d.type === 'answer') {
      return e2.pc.setRemoteDescription(d.sdp).then(function(){ flushPending(e2); });
    }
    if (d.type === 'ice') {
      if (e2.pc.remoteDescription) return e2.pc.addIceCandidate(d.candidate).catch(function(){});
      e2.pending.push(d.candidate);
    }
    return Promise.resolve();
  }

  function joinVoice(chId){
    if (!chId || S.myVoice === chId) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return toast('Этот браузер не даёт доступ к микрофону');
    }
    getMic(S.micId).then(function(stream){
      // Если были в другом голосовом канале, сначала выходим из него у себя.
      dropAllPeers();
      stopStream(S.localStream);
      S.localStream = stream;
      S.muted = false;
      return api('/api/voice', { id: S.id, channel: chId, join: true }).then(function(d){
        S.myVoice = d.myVoice;
        S.voice = d.voice;
        (S.voice[chId] || []).filter(function(m){ return m.id !== S.id; }).forEach(function(m){ createPeer(m.id, true); });
        refreshMics();
        renderAll(false);
      }).catch(function(err){
        stopStream(S.localStream); S.localStream = null;
        throw err;
      });
    }).catch(function(err){
      toast(err && err.name === 'NotAllowedError' ? 'Разреши доступ к микрофону в браузере' : (err.message || 'Не получилось войти в голос'));
    });
  }

  function leaveVoice(){
    if (!S.myVoice) return;
    var ch = S.myVoice;
    dropAllPeers();
    stopStream(S.localStream);
    S.localStream = null;
    S.myVoice = null;
    S.muted = false;
    api('/api/voice', { id: S.id, channel: ch, join: false }).catch(function(){});
    renderAll(false);
  }

  $('#voiceBar').addEventListener('click', function(e){
    if (e.target.closest('#leaveBtn')) return leaveVoice();
    if (e.target.closest('#muteBtn')) {
      if (!S.localStream) return;
      S.muted = !S.muted;
      S.localStream.getAudioTracks().forEach(function(t){ t.enabled = !S.muted; });
      renderVoiceBar();
    }
  });

  window.addEventListener('beforeunload', function(){
    if (S.myVoice && navigator.sendBeacon) {
      navigator.sendBeacon('/api/voice?code=' + encodeURIComponent(S.code),
        new Blob([JSON.stringify({ id: S.id, channel: S.myVoice, join: false })], { type: 'application/json' }));
    }
  });

  refreshMics();
})();
</script>
